<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Glass 스타일 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7; --surface:#ffffff; --text:#000; --text-2:rgba(60,60,67,.6); --line:rgba(60,60,67,.12);
  --accent:#fa2d48;
  --glass:rgba(255,255,255,.52); --glass-edge:rgba(255,255,255,.9); --glass-shadow:rgba(0,0,0,.14);
  --spring:cubic-bezier(.25,1.12,.5,1);
  --sheet:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --surface:#1c1c1e; --text:#fff; --text-2:rgba(235,235,245,.6); --line:rgba(84,84,88,.5);
    --glass:rgba(40,40,44,.5); --glass-edge:rgba(255,255,255,.18); --glass-shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1c1c1e; --text:#fff; --text-2:rgba(235,235,245,.6); --line:rgba(84,84,88,.5);
  --glass:rgba(40,40,44,.5); --glass-edge:rgba(255,255,255,.18); --glass-shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:440px;margin:0 auto;padding:0 20px 200px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{display:block}

.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(190%);
  -webkit-backdrop-filter:blur(22px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--glass-edge), inset 0 0 0 .5px var(--glass-edge), 0 10px 30px var(--glass-shadow);
}
.press{transition:transform .5s var(--spring)}
.press:active{transform:scale(1.06)}

.top .sp{flex:1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:flex-end;gap:10px;padding:12px 0}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.circle svg{width:20px;height:20px}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:4px 0 18px}

.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:999px;padding:3px;margin-bottom:28px}
.seg button{position:relative;z-index:1;padding:8px 0;font-size:14px;font-weight:500}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:999px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .55s var(--spring)}

h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
.row{display:flex;gap:12px;overflow-x:auto;margin:0 -20px 32px;padding:0 20px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 150px;text-align:left}
.card p{font-size:14px;font-weight:500;line-height:1.3;margin-top:8px}
.card span{font-size:13px;color:var(--text-2)}

.cover{aspect-ratio:1;border-radius:14px;position:relative;overflow:hidden;container-type:inline-size}
.cover b{position:absolute;left:8%;bottom:7%;font-size:15cqw;font-weight:800;line-height:1.05;letter-spacing:-.03em}
.cover i{position:absolute;border-radius:50%}

.list{background:var(--surface);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left}
.item + .item{border-top:.5px solid var(--line)}
.item .cover{width:48px;border-radius:8px;flex:none}
.item .cover b{display:none}
.item div.t{flex:1;min-width:0}
.item p{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.now p{color:var(--accent)}
.item span{font-size:13px;color:var(--text-2)}
.item em{font-style:normal;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock > *{pointer-events:auto;max-width:408px;margin-left:auto;margin-right:auto}
.mini{display:flex;align-items:center;gap:12px;border-radius:999px;padding:7px 8px 7px 7px;margin-bottom:10px;cursor:pointer;transition:transform .5s var(--spring)}
.mini:active{transform:scale(1.03)}
.mini .cover{width:40px;border-radius:50%;flex:none}
.mini .cover b{display:none}
.mini div.t{flex:1;min-width:0}
.mini p{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{font-size:12px;color:var(--text-2)}
.mini .circle{width:40px;height:40px}

.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-radius:999px;padding:6px}
.tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--text-2);transition:color .3s}
.tabs button.on{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.tabs .blob{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:999px;background:var(--line);transition:transform .6s var(--spring)}

/* 재생 화면 */
.player{position:fixed;inset:0;z-index:20;color:#fff;background:var(--c,#333);transform:translateY(100%);transition:transform .55s var(--sheet),background-color .6s;overflow:hidden;display:flex;flex-direction:column}
.pbg{position:absolute;inset:-25%;filter:blur(60px) saturate(1.5)}
.pbg .cover{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.pbg .cover b{display:none}
.player::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3);pointer-events:none}
.player.open{transform:translateY(0)}
.player.drag{transition:none}
.pin{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;max-width:440px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px calc(env(safe-area-inset-bottom,0px) + 18px)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);margin:0 auto 10px}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
.ptop p{font-size:13px;font-weight:500;opacity:.8;text-align:center}
.ptop small{display:block;font-size:15px;font-weight:700;opacity:1}
.dglass{background:rgba(255,255,255,.16);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.22)}
.art{width:min(100%,340px,42vh);margin:24px auto;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);transition:transform .7s var(--spring)}
.player.paused .art{transform:scale(.84)}
.meta{display:flex;align-items:center;gap:12px;margin-top:auto}
.meta div{flex:1;min-width:0}
.meta h3{font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:17px;opacity:.7}
.heart.on svg{fill:currentColor}
.prog{margin:22px 0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(#fff,#fff) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.28);transition:height .3s var(--spring)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:#fff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:6px}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
input[type=range]:active::-webkit-slider-runnable-track{height:11px}
.times{display:flex;justify-content:space-between;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.ctrl{display:flex;justify-content:space-around;align-items:center;margin:18px 0 20px}
.ctrl button{display:grid;place-items:center;border-radius:50%}
.ctrl .s{width:64px;height:64px}
.ctrl .s svg{width:38px;height:38px}
.ctrl .big{width:84px;height:84px}
.ctrl .big svg{width:48px;height:48px}
.vol{display:flex;align-items:center;gap:12px;opacity:.85}
.vol svg{width:18px;height:18px;flex:none}
.bar{display:flex;justify-content:space-between;margin-top:22px;border-radius:999px;padding:6px}
.bar button{flex:1;display:grid;place-items:center;height:42px;border-radius:999px;transition:background .3s,transform .5s var(--spring)}
.bar button.on{background:rgba(255,255,255,.22)}
.bar button:active{transform:scale(1.08)}
.bar svg{width:22px;height:22px}

@media (max-height:700px){.art{margin:12px auto}.ctrl{margin:10px 0 12px}.bar{margin-top:14px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="circle glass press" id="themeBtn" aria-label="테마 전환"></button>
    <span class="sp"></span>
    <button class="circle glass press" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="circle glass press" aria-label="더보기"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <h1>보관함</h1>
  <div class="seg" id="seg"><span class="pill"></span><button>전체</button><button>앨범</button><button>플레이리스트</button></div>
  <h2>최근 추가</h2>
  <div class="row" id="row"></div>
  <h2>자주 들은 곡</h2>
  <div class="list" id="list"></div>
</div>

<div class="dock">
  <div class="mini glass" id="mini" role="button" tabindex="0" aria-label="재생 화면 열기">
    <span id="miniCover"></span>
    <div class="t"><p id="miniTitle"></p><span id="miniArtist"></span></div>
    <button class="circle press" id="miniPlay" aria-label="일시정지"></button>
  </div>
  <nav class="tabs glass" id="tabs">
    <span class="blob"></span>
    <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 4v16"/></svg>보관함</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>지금 듣기</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h3l2-6 4 12 2-6h5"/></svg>라디오</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>검색</button>
  </nav>
</div>

<section class="player" id="player" aria-label="지금 재생 중" aria-hidden="true">
  <div class="pbg" id="pbg"></div>
  <div class="pin">
    <div class="grab"></div>
    <div class="ptop">
      <button class="circle dglass press" id="close" aria-label="재생 화면 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <p>보관함에서 재생 중<small id="pAlbum"></small></p>
      <button class="circle dglass press" aria-label="더보기"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <div class="art" id="art"></div>
    <div class="meta">
      <div><h3 id="pTitle"></h3><span id="pArtist"></span></div>
      <button class="circle dglass press heart" id="heart" aria-label="좋아요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    </div>
    <div class="prog"><input type="range" id="seek" min="0" max="100" step="1" value="0" aria-label="재생 위치"></div>
    <div class="times"><span id="cur">0:00</span><span id="rem">-0:00</span></div>
    <div class="ctrl">
      <button class="s press" id="prev" aria-label="이전 곡"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L3 12zM21 6v12l-8-6z"/></svg></button>
      <button class="big press" id="play" aria-label="일시정지"></button>
      <button class="s press" id="next" aria-label="다음 곡"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8-6zM3 6v12l8-6z"/></svg></button>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
      <input type="range" id="vol" min="0" max="100" step="1" value="65" aria-label="음량">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>
    </div>
    <div class="bar dglass" id="bar">
      <button aria-label="가사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 5h14v10H10l-5 4z"/></svg></button>
      <button aria-label="기기 연결"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 17a9 9 0 0 1 14 0"/><path d="M8 20h8l-4-5z" fill="currentColor"/></svg></button>
      <button aria-label="대기열"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    </div>
  </div>
</section>

<script>
const songs=[
  {t:'세곡동 가는 길',a:'한결',al:'새벽 네시',c:'#ff6b3d',f:'#2b0d00',d:'#ffd23f',s:222,k:'새벽<br>네시'},
  {t:'파란 시간',a:'윤슬',al:'Blue Hour',c:'#1f3cff',f:'#fff',d:'#ffffff',s:245,k:'Blue<br>Hour'},
  {t:'바다는 늘 그 자리',a:'파도소리',al:'여름의 끝',c:'#0f8f5c',f:'#e9ffe0',d:'#b5f23d',s:178,k:'여름의<br>끝'},
  {t:'무음 모드',a:'노이즈캔슬',al:'Static',c:'#151515',f:'#fff',d:'#fa2d48',s:201,k:'Static'},
  {t:'오후 다섯 시의 햇빛',a:'한결',al:'새벽 네시',c:'#e8b400',f:'#2e2200',d:'#ff6b3d',s:217,k:'새벽<br>네시'},
  {t:'초록 신호',a:'파도소리',al:'여름의 끝',c:'#6fae1a',f:'#13300a',d:'#0f8f5c',s:190,k:'여름의<br>끝'},
  {t:'마지막 정류장',a:'윤슬',al:'Blue Hour',c:'#fa2d48',f:'#fff',d:'#1f3cff',s:262,k:'Blue<br>Hour'}
];
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const cover=s=>`<div class="cover" style="background:${s.c};color:${s.f}"><i style="width:62%;height:62%;right:-14%;top:-14%;background:${s.d}"></i><b>${s.k}</b></div>`;

let cur=0,pos=84,playing=true;

$('row').innerHTML=[0,1,2,3].map(i=>`<button class="card" data-i="${i}">${cover(songs[i])}<p>${songs[i].al}</p><span>${songs[i].a}</span></button>`).join('');
$('list').innerHTML=songs.map((s,i)=>`<button class="item" data-i="${i}">${cover(s)}<div class="t"><p>${s.t}</p><span>${s.a}</span></div><em>${fmt(s.s)}</em></button>`).join('');
document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{load(+b.dataset.i,true);openPlayer()}));

function load(i,reset){
  cur=(i+songs.length)%songs.length; if(reset)pos=0;
  const s=songs[cur];
  $('miniCover').innerHTML=cover(s); $('miniTitle').textContent=s.t; $('miniArtist').textContent=s.a;
  $('art').innerHTML=cover(s); $('pTitle').textContent=s.t; $('pArtist').textContent=s.a; $('pAlbum').textContent=s.al;
  $('player').style.setProperty('--c',s.c);
  $('pbg').innerHTML=cover(s);
  $('seek').max=s.s;
  document.querySelectorAll('.item').forEach((el,k)=>el.classList.toggle('now',k===cur));
  playing=true; renderPlay(); renderTime();
}
function renderPlay(){
  $('play').innerHTML=$('miniPlay').innerHTML=playing?ICON_PAUSE:ICON_PLAY;
  const l=playing?'일시정지':'재생'; $('play').setAttribute('aria-label',l); $('miniPlay').setAttribute('aria-label',l);
  $('player').classList.toggle('paused',!playing);
}
function renderTime(){
  const s=songs[cur]; $('seek').value=pos;
  $('seek').style.setProperty('--p',(pos/s.s*100)+'%');
  $('cur').textContent=fmt(pos); $('rem').textContent='-'+fmt(s.s-pos);
}
function toggle(){playing=!playing;renderPlay()}
setInterval(()=>{if(!playing||seeking)return;pos++;if(pos>=songs[cur].s){load(cur+1,true)}else renderTime()},1000);

let seeking=false;
$('seek').addEventListener('input',e=>{seeking=true;pos=+e.target.value;renderTime()});
$('seek').addEventListener('change',()=>{seeking=false});
const vol=$('vol'); const paintVol=()=>vol.style.setProperty('--p',vol.value+'%'); vol.addEventListener('input',paintVol); paintVol();

$('play').onclick=toggle;
$('miniPlay').onclick=e=>{e.stopPropagation();toggle()};
$('prev').onclick=()=>pos>3?(pos=0,renderTime()):load(cur-1,true);
$('next').onclick=()=>load(cur+1,true);
$('heart').onclick=e=>e.currentTarget.classList.toggle('on');
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>{const on=b.classList.contains('on');document.querySelectorAll('#bar button').forEach(x=>x.classList.remove('on'));if(!on)b.classList.add('on')});

const player=$('player');
function openPlayer(){player.classList.add('open');player.setAttribute('aria-hidden','false');document.body.classList.add('lock')}
function closePlayer(){player.classList.remove('open');player.style.transform='';player.setAttribute('aria-hidden','true');document.body.classList.remove('lock')}
$('mini').addEventListener('click',openPlayer);
$('mini').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPlayer()}});
$('close').onclick=closePlayer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer()});

let y0=null,dy=0;
player.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;y0=e.touches[0].clientY;dy=0;player.classList.add('drag')},{passive:true});
player.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);player.style.transform=`translateY(${dy}px)`},{passive:true});
player.addEventListener('touchend',()=>{if(y0===null)return;player.classList.remove('drag');y0=null;if(dy>120)closePlayer();else player.style.transform=''});

function slider(container,indicator){
  const btns=[...container.querySelectorAll('button')];
  btns.forEach((b,i)=>b.addEventListener('click',()=>{btns.forEach(x=>x.classList.remove('on'));b.classList.add('on');indicator.style.transform=`translateX(${i*100}%)`}));
}
slider($('seg'),document.querySelector('#seg .pill'));
slider($('tabs'),document.querySelector('#tabs .blob'));

const root=document.documentElement,tb=$('themeBtn');
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
let theme=null;try{theme=localStorage.getItem('theme')}catch(e){}
theme=theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function applyTheme(){
  root.dataset.theme=theme;
  tb.innerHTML=theme==='dark'?SUN:MOON;
  tb.setAttribute('aria-label',theme==='dark'?'라이트 모드로 전환':'다크 모드로 전환');
  try{localStorage.setItem('theme',theme)}catch(e){}
}
tb.onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme()};
applyTheme();

load(0,false);
</script>
</body>
</html>
